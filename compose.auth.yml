services:
  auth-db-init:
    image: postgres:18.6-bookworm
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_db}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        case "$$POSTGRES_AUTH_DB" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_AUTH_DB must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        if [ "$$(psql --dbname=postgres --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_AUTH_DB'")" = "1" ]; then
          echo "Database $$POSTGRES_AUTH_DB already exists"
        else
          createdb --maintenance-db=postgres "$$POSTGRES_AUTH_DB"
          echo "Created database $$POSTGRES_AUTH_DB"
        fi
    networks:
      - backend

  auth-migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_db}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$POSTGRES_USER" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_USER must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        case "$$POSTGRES_AUTH_DB" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_AUTH_DB must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        exec /migrate \
          -path=/migrations \
          -database="postgres://$$POSTGRES_USER@postgres:5432/$$POSTGRES_AUTH_DB?sslmode=disable" \
          "$$@"
      - --
    command: ["version"]
    volumes:
      - ./services/auth-service/migrations:/migrations:ro
    networks:
      - backend
