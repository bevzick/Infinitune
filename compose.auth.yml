services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_HTTP_HOST: 0.0.0.0
      AUTH_HTTP_PORT: 8080
      AUTH_PASSWORD_MEMORY_KIB: ${AUTH_PASSWORD_MEMORY_KIB:-65536}
      AUTH_PASSWORD_ITERATIONS: ${AUTH_PASSWORD_ITERATIONS:-3}
      AUTH_PASSWORD_PARALLELISM: ${AUTH_PASSWORD_PARALLELISM:-4}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-720h}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-false}
      AUTH_SESSION_COOKIE_SAME_SITE: ${AUTH_SESSION_COOKIE_SAME_SITE:-lax}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-infinitune-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-infinitune-api}
      AUTH_JWT_ACCESS_TTL: ${AUTH_JWT_ACCESS_TTL:-15m}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-auth-key-1}
      AUTH_JWT_PRIVATE_KEY_BASE64: ${AUTH_JWT_PRIVATE_KEY_BASE64:?AUTH_JWT_PRIVATE_KEY_BASE64 is required}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_AUTH_DB: ${REDIS_AUTH_DB:-0}
    expose:
      - "8080"
    networks:
      - backend

  auth-db-init:
    image: postgres:18.6-bookworm
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_db}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        case "$$POSTGRES_AUTH_DB" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_AUTH_DB must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        if [ "$$(psql --dbname=postgres --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_AUTH_DB'")" = "1" ]; then
          echo "Database $$POSTGRES_AUTH_DB already exists"
        else
          createdb --maintenance-db=postgres "$$POSTGRES_AUTH_DB"
          echo "Created database $$POSTGRES_AUTH_DB"
        fi
    networks:
      - backend

  auth-migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_db}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$POSTGRES_USER" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_USER must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        case "$$POSTGRES_AUTH_DB" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_AUTH_DB must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        case "$$POSTGRES_HOST:$$POSTGRES_PORT" in
          ""|*[!a-zA-Z0-9_.:-]*)
            echo "POSTGRES_HOST and POSTGRES_PORT contain unsupported characters" >&2
            exit 1
            ;;
        esac

        exec /migrate \
          -path=/migrations \
          -database="postgres://$$POSTGRES_USER@$$POSTGRES_HOST:$$POSTGRES_PORT/$$POSTGRES_AUTH_DB?sslmode=disable" \
          "$$@"
      - --
    command: ["version"]
    volumes:
      - ./services/auth-service/migrations:/migrations:ro
    networks:
      - backend

  auth-integration-test:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
      target: source
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INFINITUNE_INTEGRATION_TESTS: "1"
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-auth_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_AUTH_DB: ${REDIS_AUTH_DB:-0}
    entrypoint:
      - go
      - test
      - -tags=integration
      - -count=1
    command:
      - ./internal/repository/postgres
      - ./internal/repository/redis
    networks:
      - backend
