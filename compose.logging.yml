services:
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./infra/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks:
      - backend

  alloy:
    image: grafana/alloy:v1.21.0
    restart: unless-stopped
    command:
      - run
      - --disable-reporting
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      INFINITUNE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-infinitune}
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    depends_on:
      loki:
        condition: service_started
    networks:
      - backend

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/grafana/provisioning/datasources/infinitune.yml:/etc/grafana/provisioning/datasources/infinitune.yml:ro
      - ./infra/grafana/provisioning/dashboards/infinitune.yml:/etc/grafana/provisioning/dashboards/infinitune.yml:ro
      - ./infra/grafana/provisioning/alerting/log-alerts.yml:/etc/grafana/provisioning/alerting/log-alerts.yml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - backend

volumes:
  loki_data:
  alloy_data:
  grafana_data:
