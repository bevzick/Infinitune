services:
  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MEDIA_HTTP_HOST: 0.0.0.0
      MEDIA_HTTP_PORT: 8080
      MEDIA_GRPC_HOST: 0.0.0.0
      MEDIA_GRPC_PORT: 9090
      MEDIA_AUTH_JWKS_URL: ${MEDIA_AUTH_JWKS_URL:-http://auth-service:8080/v1/auth/jwks}
      MEDIA_ALLOWED_ORIGINS: ${MEDIA_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-infinitune-auth}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-infinitune-api}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:-auth-key-1}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MEDIA_DB: ${POSTGRES_MEDIA_DB:-media_db}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-infinitune-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    expose:
      - "8080"
      - "9090"
    networks:
      - backend
      - media-storage

  media-db-init:
    image: postgres:18.6-bookworm
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MEDIA_DB: ${POSTGRES_MEDIA_DB:-media_db}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        case "$$POSTGRES_MEDIA_DB" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_MEDIA_DB must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        if [ "$$(psql --dbname=postgres --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_MEDIA_DB'")" = "1" ]; then
          echo "Database $$POSTGRES_MEDIA_DB already exists"
        else
          createdb --maintenance-db=postgres "$$POSTGRES_MEDIA_DB"
          echo "Created database $$POSTGRES_MEDIA_DB"
        fi
    networks:
      - backend

  media-migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      media-db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MEDIA_DB: ${POSTGRES_MEDIA_DB:-media_db}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$POSTGRES_USER" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_USER must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        case "$$POSTGRES_MEDIA_DB" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_MEDIA_DB must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        case "$$POSTGRES_HOST:$$POSTGRES_PORT" in
          ""|*[!a-zA-Z0-9_.:-]*)
            echo "POSTGRES_HOST and POSTGRES_PORT contain unsupported characters" >&2
            exit 1
            ;;
        esac

        exec /migrate \
          -path=/migrations \
          -database="postgres://$$POSTGRES_USER@$$POSTGRES_HOST:$$POSTGRES_PORT/$$POSTGRES_MEDIA_DB?sslmode=disable" \
          "$$@"
      - --
    command: ["version"]
    volumes:
      - ./services/media-service/migrations:/migrations:ro
    networks:
      - backend

  media-integration-test:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
      target: source
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      media-service:
        condition: service_healthy
    environment:
      INFINITUNE_INTEGRATION_TESTS: "1"
      MEDIA_GRPC_TEST_TARGET: media-service:9090
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_MEDIA_DB: ${POSTGRES_MEDIA_DB:-media_db}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-infinitune-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    entrypoint:
      - go
      - test
      - -tags=integration
      - -count=1
    command:
      - ./internal/schema
      - ./internal/storage
      - ./internal/repository/postgres
      - ./internal/grpcapi
    networks:
      - backend
      - media-storage
