global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: infinitune-kafka-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - history-service:8080
          - interaction-service:8080
          - media-service:8080
          - catalog-service:8080
          - content-service:8080
          - recommendation-service:8080
