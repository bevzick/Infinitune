apiVersion: 1

prune: true

datasources:
  - name: Loki
    type: loki
    uid: infinitune-loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false

  - name: Prometheus
    type: prometheus
    uid: infinitune-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      timeInterval: 15s
