_format_version: "3.0"
_transform: true

consumers:
  - username: auth-service
    jwt_secrets:
      - key: "__AUTH_JWT_ISSUER__"
        algorithm: EdDSA
        secret: unused
        rsa_public_key: |
          __AUTH_JWT_PUBLIC_KEY__

services:
  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-public
        paths:
          - ~/v1/auth/(?:register|login|refresh|logout)$
        methods:
          - POST
          - OPTIONS
        regex_priority: 100
        strip_path: false

      - name: auth-keys
        paths:
          - ~/v1/auth/jwks$
        methods:
          - GET
          - OPTIONS
        regex_priority: 100
        strip_path: false

      - name: auth-protected
        paths:
          - ~/v1/auth(?:/|$)
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: false

  - name: user-service
    url: http://user-service:8080
    routes:
      - name: user-public-profiles
        paths:
          - ~/v1/users/profiles/[0-9a-fA-F-]+$
        methods:
          - GET
          - OPTIONS
        regex_priority: 100
        strip_path: false

      - name: user-protected
        paths:
          - ~/v1/users/me(?:/|$)
        regex_priority: 100
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: false

  - name: catalog-service
    url: http://catalog-service:8080
    routes:
      - name: catalog-public
        paths:
          - ~/v1/catalog(?:/|$)
        methods:
          - GET
          - OPTIONS
        regex_priority: 100
        strip_path: false

  - name: media-service
    url: http://media-service:8080
    routes:
      - name: media-creator-upload
        paths:
          - ~/v1/media/uploads/[0-9a-fA-F-]+$
        methods:
          - PUT
          - OPTIONS
        regex_priority: 110
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: false

      - name: media-playback
        paths:
          - ~/v1/media/assets/[0-9a-fA-F-]+/playback$
        methods:
          - GET
          - OPTIONS
        regex_priority: 100
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: false

  - name: playlist-service
    url: http://playlist-service:8080
    routes:
      - name: playlist-read
        paths:
          - ~/v1/playlists/[0-9a-fA-F-]+(?:/(?:tracks|resolved-tracks))?$
        methods:
          - GET
        regex_priority: 100
        strip_path: false

      - name: playlist-criteria-read
        paths:
          - ~/v1/playlists/[0-9a-fA-F-]+/criteria$
        methods:
          - GET
        regex_priority: 105
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: false

      - name: playlist-options
        paths:
          - ~/v1/playlists(?:/|$)
        methods:
          - OPTIONS
        regex_priority: 110
        strip_path: false

      - name: playlist-protected
        paths:
          - ~/v1/playlists(?:/|$)
        methods:
          - POST
          - PATCH
          - PUT
          - DELETE
        regex_priority: 90
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: false

  - name: content-service
    url: http://content-service:8080
    routes:
      - name: content-options
        paths:
          - ~/v1/creators(?:/|$)
        methods:
          - OPTIONS
        regex_priority: 110
        strip_path: false

      - name: content-protected
        paths:
          - ~/v1/creators(?:/|$)
        methods:
          - GET
          - POST
          - PATCH
          - DELETE
        regex_priority: 100
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp
              run_on_preflight: false
