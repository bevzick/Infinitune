name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "compose.frontend.yml"
      - "compose.yml"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "compose.frontend.yml"
      - "compose.yml"
      - ".env.example"
      - "Makefile"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build and browser smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint rules
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Production container smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate frontend Compose configuration
        env:
          AUTH_JWT_PUBLIC_KEY_BASE64: ci-placeholder
          POSTGRES_DB: ci_db
          POSTGRES_PASSWORD: ci_password
          POSTGRES_USER: ci_user
        run: docker compose -f compose.yml -f compose.frontend.yml config --quiet

      - name: Build production image
        run: docker build --tag infinitune-frontend:smoke frontend

      - name: Test production container
        run: frontend/scripts/container-smoke.sh infinitune-frontend:smoke
