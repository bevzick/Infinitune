syntax = "proto3";

package infinitune.user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/bevzick/Infinitune/services/user-service/api/user/v1;userv1";

service UserService {
  rpc GetPublicProfile(GetPublicProfileRequest) returns (PublicProfile);
  rpc GetRecommendationPreferences(GetRecommendationPreferencesRequest) returns (RecommendationPreferences);
}

message GetRecommendationPreferencesRequest {
  string user_id = 1;
}

message WeightedPreference {
  string id = 1;
  double weight = 2;
}

message RecommendationPreferences {
  bool recommendations_enabled = 1;
  optional string preferred_mood_id = 2;
  repeated WeightedPreference genres = 3;
  repeated WeightedPreference artists = 4;
  bool explicit_content_allowed = 5;
}

message GetPublicProfileRequest {
  string user_id = 1;
}

message PublicProfile {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  string avatar_url = 5;
  string country_code = 6;
  string language = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
