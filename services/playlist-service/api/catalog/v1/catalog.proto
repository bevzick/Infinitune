syntax = "proto3";

package infinitune.catalog.v1;

option go_package = "github.com/bevzick/Infinitune/services/playlist-service/api/catalog/v1;catalogv1";

// Consumer-side subset of the Catalog Service contract used by Playlist Service.
service CatalogService {
  rpc ValidateTrackIds(ValidateTrackIdsRequest) returns (ValidateTrackIdsResponse);
  rpc EvaluateTrackFilters(EvaluateTrackFiltersRequest) returns (EvaluateTrackFiltersResponse);
}

message ValidateTrackIdsRequest {
  repeated string track_ids = 1;
}

message ValidateTrackIdsResponse {
  repeated string valid_track_ids = 1;
  repeated string missing_track_ids = 2;
}

enum TrackSort {
  TRACK_SORT_UNSPECIFIED = 0;
  TRACK_SORT_NEWEST = 1;
  TRACK_SORT_OLDEST = 2;
  TRACK_SORT_TITLE_ASC = 3;
  TRACK_SORT_TITLE_DESC = 4;
}

enum FilterLogic {
  FILTER_LOGIC_UNSPECIFIED = 0;
  FILTER_LOGIC_AND = 1;
  FILTER_LOGIC_OR = 2;
}

enum TrackFilterField {
  TRACK_FILTER_FIELD_UNSPECIFIED = 0;
  TRACK_FILTER_FIELD_TITLE = 1;
  TRACK_FILTER_FIELD_ARTIST_ID = 2;
  TRACK_FILTER_FIELD_ALBUM_ID = 3;
  TRACK_FILTER_FIELD_GENRE_ID = 4;
  TRACK_FILTER_FIELD_MOOD_ID = 5;
  TRACK_FILTER_FIELD_RELEASE_YEAR = 6;
  TRACK_FILTER_FIELD_DURATION_MS = 7;
  TRACK_FILTER_FIELD_EXPLICIT = 8;
}

enum TrackFilterOperator {
  TRACK_FILTER_OPERATOR_UNSPECIFIED = 0;
  TRACK_FILTER_OPERATOR_EQUALS = 1;
  TRACK_FILTER_OPERATOR_CONTAINS = 2;
  TRACK_FILTER_OPERATOR_IN = 3;
  TRACK_FILTER_OPERATOR_GREATER_THAN = 4;
  TRACK_FILTER_OPERATOR_GREATER_THAN_OR_EQUAL = 5;
  TRACK_FILTER_OPERATOR_LESS_THAN = 6;
  TRACK_FILTER_OPERATOR_LESS_THAN_OR_EQUAL = 7;
  TRACK_FILTER_OPERATOR_BETWEEN = 8;
}

message UUIDList {
  repeated string values = 1;
}

message IntegerRange {
  int32 minimum = 1;
  int32 maximum = 2;
}

message TrackFilterValue {
  oneof kind {
    string text = 1;
    string uuid = 2;
    UUIDList uuid_list = 3;
    int32 integer = 4;
    IntegerRange integer_range = 5;
    bool boolean = 6;
  }
}

message TrackFilter {
  TrackFilterField field = 1;
  TrackFilterOperator operator = 2;
  TrackFilterValue value = 3;
}

message EvaluateTrackFiltersRequest {
  FilterLogic logic = 1;
  repeated TrackFilter filters = 2;
  TrackSort sort = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message EvaluateTrackFiltersResponse {
  repeated Track tracks = 1;
  Page page = 2;
}

// Consumer-side subset of Catalog Track. Playlist needs only stable identities.
message Track {
  string id = 1;
}

message Page {
  int32 limit = 1;
  int32 offset = 2;
  int64 total = 3;
}
