syntax = "proto3";

package infinitune.content.v1;

option go_package = "github.com/bevzick/Infinitune/services/media-service/api/content/v1;contentv1";

// Consumer-owned subset of the Content service contract used by Media ingest.
service ContentService {
  rpc GetUploadSession(GetUploadSessionRequest) returns (UploadSession);
  rpc TransitionUpload(TransitionUploadRequest) returns (UploadSession);
}

message GetUploadSessionRequest {
  string upload_id = 1;
  string user_id = 2;
}

message TransitionUploadRequest {
  string upload_id = 1;
  string target_status = 2;
}

message UploadSession {
  string id = 1;
  string release_track_id = 2;
  string requested_by_user_id = 3;
  string object_key = 4;
  string original_name = 5;
  string mime_type = 6;
  int64 size_bytes = 7;
  string status = 8;
}
