syntax = "proto3";

package infinitune.catalog.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/bevzick/Infinitune/services/catalog-service/api/catalog/v1;catalogv1";

service CatalogService {
  // Returns tracks in request order. Fails with NOT_FOUND if any ID is missing.
  rpc GetTracks(GetTracksRequest) returns (GetTracksResponse);

  // Separates requested IDs into ordered valid and missing collections.
  rpc ValidateTrackIds(ValidateTrackIdsRequest) returns (ValidateTrackIdsResponse);

  // Applies the supported hard filters with stable pagination and sorting.
  rpc FilterTracks(FilterTracksRequest) returns (FilterTracksResponse);
}

message GetTracksRequest {
  repeated string track_ids = 1;
}

message GetTracksResponse {
  repeated Track tracks = 1;
}

message ValidateTrackIdsRequest {
  repeated string track_ids = 1;
}

message ValidateTrackIdsResponse {
  repeated string valid_track_ids = 1;
  repeated string missing_track_ids = 2;
}

enum TrackSort {
  TRACK_SORT_UNSPECIFIED = 0;
  TRACK_SORT_NEWEST = 1;
  TRACK_SORT_OLDEST = 2;
  TRACK_SORT_TITLE_ASC = 3;
  TRACK_SORT_TITLE_DESC = 4;
}

message FilterTracksRequest {
  string title = 1;
  string artist_id = 2;
  string album_id = 3;
  string genre_id = 4;
  string mood_id = 5;
  optional int32 release_year = 6;
  optional bool explicit = 7;
  TrackSort sort = 8;
  int32 limit = 9;
  int32 offset = 10;
}

message FilterTracksResponse {
  repeated Track tracks = 1;
  Page page = 2;
}

message Page {
  int32 limit = 1;
  int32 offset = 2;
  int64 total = 3;
}

message Track {
  string id = 1;
  string album_id = 2;
  string title = 3;
  int32 duration_ms = 4;
  int32 track_number = 5;
  int32 disc_number = 6;
  bool explicit = 7;
  Date release_date = 8;
  string media_asset_id = 9;
  string content_id = 10;
  repeated ArtistCredit artists = 11;
  repeated Genre genres = 12;
  repeated TrackMood moods = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message Date {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

message ArtistCredit {
  Artist artist = 1;
  ArtistRole role = 2;
  int32 position = 3;
}

message Artist {
  string id = 1;
  string name = 2;
  string image_url = 3;
}

enum ArtistRole {
  ARTIST_ROLE_UNSPECIFIED = 0;
  ARTIST_ROLE_PRIMARY = 1;
  ARTIST_ROLE_FEATURED = 2;
  ARTIST_ROLE_PRODUCER = 3;
  ARTIST_ROLE_COMPOSER = 4;
}

message Genre {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message TrackMood {
  Mood mood = 1;
  double weight = 2;
}

message Mood {
  string id = 1;
  string name = 2;
  string slug = 3;
}
