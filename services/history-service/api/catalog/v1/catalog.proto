syntax = "proto3";

package infinitune.catalog.v1;

option go_package = "github.com/bevzick/Infinitune/services/history-service/api/catalog/v1;catalogv1";

service CatalogService {
  rpc GetTracks(GetTracksRequest) returns (GetTracksResponse);
}

message GetTracksRequest {
  repeated string track_ids = 1;
}

message GetTracksResponse {
  repeated Track tracks = 1;
}

message Track {
  string id = 1;
  string album_id = 2;
  string title = 3;
  int32 duration_ms = 4;
}
