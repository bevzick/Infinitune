syntax = "proto3";

package infinitune.content.v1;

option go_package = "github.com/bevzick/Infinitune/services/content-service/api/content/v1;contentv1";

service ContentService {
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GetUploadSession(GetUploadSessionRequest) returns (UploadSession);
  rpc TransitionUpload(TransitionUploadRequest) returns (UploadSession);
}

message CheckPermissionRequest {
  string creator_id = 1;
  string user_id = 2;
  string permission = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string member_role = 2;
  string verification_status = 3;
}

message GetUploadSessionRequest {
  string upload_id = 1;
  string user_id = 2;
}

message TransitionUploadRequest {
  string upload_id = 1;
  string target_status = 2;
}

message UploadSession {
  string id = 1;
  string release_track_id = 2;
  string requested_by_user_id = 3;
  string object_key = 4;
  string original_name = 5;
  string mime_type = 6;
  int64 size_bytes = 7;
  string status = 8;
}
