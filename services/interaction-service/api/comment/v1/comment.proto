syntax = "proto3";

package infinitune.comment.v1;

option go_package = "github.com/bevzick/Infinitune/services/interaction-service/api/comment/v1;commentv1";

// Consumer-side subset of Comment used to validate like targets.
service CommentService {
  rpc ValidateCommentIds(ValidateCommentIdsRequest) returns (ValidateCommentIdsResponse);
}

message ValidateCommentIdsRequest {
  repeated string comment_ids = 1;
}

message ValidateCommentIdsResponse {
  repeated string valid_comment_ids = 1;
  repeated string missing_comment_ids = 2;
}
