services:
  playlist-service:
    build:
      context: ./services/playlist-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PLAYLIST_HTTP_HOST: 0.0.0.0
      PLAYLIST_HTTP_PORT: 8080
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_PLAYLIST_DB: ${POSTGRES_PLAYLIST_DB:-playlist_db}
    expose:
      - "8080"
    networks:
      - backend

  playlist-db-init:
    image: postgres:18.6-bookworm
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_PLAYLIST_DB: ${POSTGRES_PLAYLIST_DB:-playlist_db}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        case "$$POSTGRES_PLAYLIST_DB" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_PLAYLIST_DB must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        if [ "$$(psql --dbname=postgres --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_PLAYLIST_DB'")" = "1" ]; then
          echo "Database $$POSTGRES_PLAYLIST_DB already exists"
        else
          createdb --maintenance-db=postgres "$$POSTGRES_PLAYLIST_DB"
          echo "Created database $$POSTGRES_PLAYLIST_DB"
        fi
    networks:
      - backend

  playlist-migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      playlist-db-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_PLAYLIST_DB: ${POSTGRES_PLAYLIST_DB:-playlist_db}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$POSTGRES_USER" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_USER must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        case "$$POSTGRES_PLAYLIST_DB" in
          ""|*[!a-zA-Z0-9_]*)
            echo "POSTGRES_PLAYLIST_DB must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac

        case "$$POSTGRES_HOST:$$POSTGRES_PORT" in
          ""|*[!a-zA-Z0-9_.:-]*)
            echo "POSTGRES_HOST and POSTGRES_PORT contain unsupported characters" >&2
            exit 1
            ;;
        esac

        exec /migrate \
          -path=/migrations \
          -database="postgres://$$POSTGRES_USER@$$POSTGRES_HOST:$$POSTGRES_PORT/$$POSTGRES_PLAYLIST_DB?sslmode=disable" \
          "$$@"
      - --
    command: ["version"]
    volumes:
      - ./services/playlist-service/migrations:/migrations:ro
    networks:
      - backend

  playlist-integration-test:
    build:
      context: ./services/playlist-service
      dockerfile: Dockerfile
      target: source
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      playlist-service:
        condition: service_healthy
    environment:
      INFINITUNE_INTEGRATION_TESTS: "1"
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_PLAYLIST_DB: ${POSTGRES_PLAYLIST_DB:-playlist_db}
    entrypoint:
      - go
      - test
      - -tags=integration
      - -count=1
    command:
      - ./internal/schema
    networks:
      - backend
